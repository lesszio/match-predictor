name: Actualizar predicciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular predicciones
        run: python predictor.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Guardar resultados
        run: |
          git config user.name "predictor-bot"
          git config user.email "predictor-bot@users.noreply.github.com"
          git add docs/predicciones.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza predicciones"
            git push
          fi
